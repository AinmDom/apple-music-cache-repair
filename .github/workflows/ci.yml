name: Windows regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated regression suite
        shell: ${{ matrix.shell }}
        run: ./tests/Run-Tests.ps1
      - name: Validate release packaging
        shell: ${{ matrix.shell }}
        run: ./tools/Build-Release.ps1
